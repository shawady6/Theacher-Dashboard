<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="المجموعات" />
  <title>إدارة المجموعات الدراسية</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar (شريط جانبي على الكمبيوتر / شريط سفلي على الموبايل) -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">ت</div>
        <div class="brand-text">
          <div class="brand-title">إدارة المجموعات</div>
          <div class="brand-sub">لوحة المعلم</div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-item" data-view="dashboard"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></span><span>الرئيسية</span></a>
        <a class="nav-item" data-view="groups"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.2 4.5 2 4.5 5.3"/></svg></span><span>المجموعات</span></a>
        <a class="nav-item" data-view="payments"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v.01M18 14.5v.01"/></svg></span><span>المدفوعات</span></a>
        <a class="nav-item" data-view="attendance"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8 5.7-5.8"/></svg></span><span>الحضور</span></a>
        <a class="nav-item nav-desk" data-view="exams"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14.5 3v4.5H19"/><path d="M9 13h6M9 17h6"/></svg></span><span>الامتحانات</span></a>
        <a class="nav-item nav-desk" data-view="monthly"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></span><span>التقرير</span></a>
        <a class="nav-item nav-more" data-view="more"><span class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="19" cy="12" r="1.7" fill="currentColor"/></svg></span><span>المزيد</span></a>
      </nav>

      <div class="sidebar-footer">
        <input type="file" id="importFile" accept="application/json" hidden />
        <button id="advancedSettingsBtn" class="btn btn-ghost btn-sm" title="المزامنة والنسخ الاحتياطي والاستيراد ومسح البيانات">
          <span>⚙</span> إعدادات متقدمة
        </button>
        <div class="version">الإصدار 4.0</div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">الرئيسية</h1>
          <div id="pageSub" class="page-sub">نظرة عامة على مجموعاتك</div>
        </div>
        <div class="topbar-actions">
          <button id="installBtn" class="btn btn-secondary btn-sm" hidden aria-label="تثبيت التطبيق"><span class="ico">⬇</span><span class="lbl"> تثبيت التطبيق</span></button>
          <button id="undoBtn" class="btn btn-secondary btn-sm undo-btn" disabled title="تراجع" aria-label="تراجع"><span class="ico">↶</span><span class="lbl"> تراجع</span></button>
          <button id="syncPill" class="sync-pill offline" type="button">⚠ غير متصل</button>
          <button id="mobileSettings" class="icon-btn mobile-only" aria-label="الإعدادات">⚙</button>
          <div class="today-pill">
            <span class="dot"></span>
            <span id="todayLabel">—</span>
          </div>
        </div>
      </header>

      <div id="banner"></div>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">—</h3>
        <button class="icon-btn" data-close aria-label="إغلاق">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- الزرار العائم (موبايل) -->
  <button id="fab" class="fab" hidden aria-label="إضافة">+</button>

  <noscript><p style="padding:20px">يلزم تفعيل JavaScript لتشغيل التطبيق.</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
